name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/windows.yml

  package:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: wgr-windows-portable
          path: dist

      - name: Conferir pacote
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw 'Esperado exatamente um pacote validado.' }
          ./scripts/Verify-Package.ps1 -Zip $zips[0].FullName

      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $files = Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty FullName
          if ($env:RELEASE_TAG -notmatch '^v[0-9][A-Za-z0-9._-]*$') { throw 'Tag de release inválida.' }
          $tagCommit = git rev-parse --verify --quiet "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -eq 0 -and $tagCommit -ne '${{ github.sha }}') { throw 'A tag existente aponta para outro commit.' }
          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release upload $env:RELEASE_TAG @files --clobber
          } else {
            gh release create $env:RELEASE_TAG --target '${{ github.sha }}' --title "WGR $env:RELEASE_TAG" --generate-notes @files
          }
          if ($LASTEXITCODE) { throw 'Publicação da release falhou.' }
