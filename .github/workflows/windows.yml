name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      portable:
        description: 'Gerar também o pacote portable completo'
        type: boolean
        default: false
  workflow_call:
    inputs:
      portable:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # audiopus_sys/Opus trazido pelo upstream exige a política legada do CMake.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wgr-windows-release

      - name: Build release (launcher)
        shell: pwsh
        run: cargo build --release --workspace --locked

      - name: Build release (runtime nativo)
        shell: pwsh
        run: cargo build --manifest-path vendor/muguet/Cargo.toml --bin wgr-rage --release --locked --jobs 2 --target-dir target

      - name: Conferir binários
        shell: pwsh
        run: |
          foreach ($binary in @('target/release/WGR.exe', 'target/release/wgr-rage.exe')) {
            if (-not (Test-Path -LiteralPath $binary)) { throw "Binário ausente: $binary" }
          }
          Get-FileHash -LiteralPath target/release/WGR.exe, target/release/wgr-rage.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -LiteralPath target/release/SHA256SUMS.txt
          Get-Content -LiteralPath target/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wgr-windows-binaries
          compression-level: 1
          path: |
            target/release/WGR.exe
            target/release/wgr-rage.exe
            target/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Empacotar e conferir distribuição portable
        if: inputs.portable == true
        shell: pwsh
        run: ./scripts/Package.ps1 -SkipBuild -BuildDir target -DistDir dist

      - uses: actions/upload-artifact@v4
        if: inputs.portable == true
        with:
          name: wgr-windows-portable
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
