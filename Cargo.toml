[workspace]
members = ["crates/wgr-core", "crates/wgr-http", "crates/wgr-app", "crates/wgr-runtime", "crates/wgr-player"]
exclude = ["vendor/momor", "vendor/muguet"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
opt-level = 2
lto = false
debug = 0
incremental = false
