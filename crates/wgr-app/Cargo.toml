[package]
name = "wgr-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "WGR"
path = "src/main.rs"

[features]
default = []
web-compat = ["dep:webview2-com"]

[dependencies]
wgr-core = { path = "../wgr-core" }
wgr-http = { path = "../wgr-http" }
wgr-runtime = { path = "../wgr-runtime" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
momor-ui = { package = "ui", path = "../../vendor/momor/crates/ui" }
theme = { path = "../../vendor/momor/crates/theme" }
momor-input = { package = "ui_input", path = "../../vendor/momor/crates/ui_input" }
momor-menu = { package = "menu", path = "../../vendor/momor/crates/menu" }
raw-window-handle = "0.6.2"
webview2-com = { version = "=0.39.1", optional = true }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tracing-appender = "0.2.3"
futures = "0.3.31"
unicode-segmentation = "1.12.0"
url = "2.5.7"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3.31"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
rust-embed = "8.13.0"

[build-dependencies]
embed-resource = "3.0.6"

[dev-dependencies]
tempfile = "3.23.0"
