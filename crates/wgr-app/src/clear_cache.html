<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Limpeza de cache WGR</title><body style="background:#222;color:#ddd;font:14px Segoe UI">Limpando apenas os downloads em cache. Os saves permanecem no IndexedDB.<script>
(async()=>{try{if(navigator.storage?.getDirectory){const root=await navigator.storage.getDirectory();try{await root.removeEntry('gamedata',{recursive:true})}catch(error){if(error.name!=='NotFoundError')throw error}}await new Promise((resolve,reject)=>{const request=indexedDB.deleteDatabase('wgr-block-cache-v1');request.onsuccess=resolve;request.onerror=()=>reject(request.error);request.onblocked=()=>reject(Error('Cache ainda em uso'));});chrome.webview.postMessage(JSON.stringify({type:'profile_cache_cleared',ok:true}));}catch(error){chrome.webview.postMessage(JSON.stringify({type:'profile_cache_cleared',ok:false,error:String(error)}))}})();
</script></body></html>
