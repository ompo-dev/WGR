# muguet - Cargo.toml
# Constantin Clerc (c22dev) - 0.1

[package]
name = "muguet"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
autobins = false

[[bin]]
name = "wgr-rage"
path = "src/main.rs"

[dependencies]
rustc-hash = "2"
wasmtime = { version = "=50.0.0", default-features = false, features = ["runtime", "std", "threads", "anyhow", "demangle", "backtrace"] }
anyhow = "1"
libc = "0.2"
serde_json = "1.0.151"
wgpu = "30.0.1"
pollster = "1.0.1"
regex = "1.13.1"
winit = "0.30.13"
cpal = "0.18.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
wasmparser = { version = "0.258.3", optional = true }
wasm-encoder = { version = "0.258.3", optional = true, features = ["wasmparser"] }
bcdec_rs = "0.2.0"
audiopus_sys = { version = "0.2", features = ["static"] }
rayon = "1.12"
raw-window-handle = "0.6"
wgr-core = { path = "../../crates/wgr-core" }
reqwest = { version = "0.12.24", default-features = false }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "net"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-game-controller = { version = "0.3", default-features = false, features = ["std", "GCController", "GCExtendedGamepad", "GCPhysicalInputProfile", "GCControllerElement", "GCControllerAxisInput", "GCControllerButtonInput", "GCControllerDirectionPad", "GCKeyboard", "GCKeyboardInput", "GCKeyCodes", "objc2-core-foundation", "GCMouse", "GCMouseInput", "GCDeviceCursor", "block2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController"] }

[features]
default = ["jit"]
jit = ["wasmtime/cranelift", "wasmtime/parallel-compilation", "dep:wasmparser", "dep:wasm-encoder"]

[profile.release]
opt-level = 3
lto = false
debug = 0
strip = "debuginfo"
incremental = false

[patch.crates-io]
wgpu-core = { path = "vendor/wgpu-core" }
winit = { path = "vendor/winit" }
